<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarked - ToList</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col font-sans">

    <header class="bg-[#dca4fc] h-16 flex items-center px-6 sticky top-0 z-10 w-full">
        <div class="w-56 font-bold text-2xl text-black">
            ToList
        </div>
        <div class="flex-1 ml-4">
            <input type="text" placeholder="cari catatan" 
                class="px-5 py-2 rounded-full w-full max-w-md focus:outline-none focus:ring-2 focus:ring-purple-600 text-sm">
        </div>
    </header>

    <div class="flex flex-1">
        
        <aside class="w-56 bg-[#1a1a3a] flex flex-col justify-between min-h-[calc(100vh-4rem)] p-4 shadow-lg">
            
            <div class="space-y-4 mt-2">
                <a href="home.html" class="block w-full text-center py-2 bg-white text-[#1a1a3a] font-bold rounded-lg hover:bg-gray-200 transition">
                    home
                </a>
                <a href="upload.html" class="block w-full text-center py-2 bg-white text-[#1a1a3a] font-bold rounded-lg hover:bg-gray-200 transition">
                    upload
                </a>
                <a href="todo.html" class="block w-full text-center py-2 bg-white text-[#1a1a3a] font-bold rounded-lg hover:bg-gray-200 transition">
                    to-do list
                </a>
                <a href="bookmarked.html" class="block w-full text-center py-2 bg-[#dca4fc] text-[#1a1a3a] font-bold rounded-lg shadow-md">
                    bookmarked
                </a>
            </div>

            <a href="logout.html" class="block w-full text-center py-2 bg-[#dca4fc] text-[#1a1a3a] font-bold rounded-lg mb-4 hover:bg-purple-400 transition">
                logout
            </a>
        </aside>

        <main class="flex-1 p-8 bg-gray-50 overflow-y-auto">
            
            <div class="mb-6 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">Catatan Tersimpan (Bookmarked)</h2>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                
                <div class="border rounded-2xl p-4 shadow-sm hover:shadow-lg transition bg-white flex flex-col h-full">
                    <img src="https://images.unsplash.com/photo-1542831371-29b0f74f9713?q=80&w=300&auto=format&fit=crop" alt="Cover" class="w-full h-32 object-cover rounded-xl mb-4 border">
                    <h3 class="font-bold text-lg text-gray-800 leading-tight mb-2 flex-grow">Query SQL Lanjutan</h3>
                    <div>
                        <span class="inline-block bg-gray-100 text-gray-600 text-[10px] font-bold px-3 py-1 rounded-md uppercase tracking-wider">DATABASE</span>
                    </div>
                </div>

                <div class="border rounded-2xl p-4 shadow-sm hover:shadow-lg transition bg-white flex flex-col h-full">
                    <img src="https://images.unsplash.com/photo-1555949963-aa79dcee981c?q=80&w=300&auto=format&fit=crop" alt="Cover" class="w-full h-32 object-cover rounded-xl mb-4 border">
                    <h3 class="font-bold text-lg text-gray-800 leading-tight mb-2 flex-grow">Struktur Data: Linked List</h3>
                    <div>
                        <span class="inline-block bg-gray-100 text-gray-600 text-[10px] font-bold px-3 py-1 rounded-md uppercase tracking-wider">CODING</span>
                    </div>
                </div>

                <div class="border rounded-2xl p-4 shadow-sm hover:shadow-lg transition bg-white flex flex-col h-full">
                    <img src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?q=80&w=300&auto=format&fit=crop" alt="Cover" class="w-full h-32 object-cover rounded-xl mb-4 border">
                    <h3 class="font-bold text-lg text-gray-800 leading-tight mb-2 flex-grow">Pemrograman Web Dasar</h3>
                    <div>
                        <span class="inline-block bg-gray-100 text-gray-600 text-[10px] font-bold px-3 py-1 rounded-md uppercase tracking-wider">CODING</span>
                    </div>
                </div>

            </div>
        </main>

    </div>

</body>
</html>
