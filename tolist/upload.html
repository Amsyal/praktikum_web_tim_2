<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToList - Main Page</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-[#fdf4ff] min-h-screen font-sans">

    <nav class="fixed top-0 z-[999] w-full h-[70px] bg-[#ddaffc] px-6 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-4">
            <div id="hamburger" class="cursor-pointer md:hidden group">
                <div class="w-6 h-0.5 bg-gray-600 mb-1.5 transition-all"></div>
                <div class="w-6 h-0.5 bg-gray-600 mb-1.5 transition-all"></div>
                <div class="w-6 h-0.5 bg-gray-600 transition-all"></div>
            </div>
            
            <h1 class="text-2xl font-bold text-gray-800">ToList</h1>
            
            <div class="hidden md:block ml-25 relative w-64">
                <input type="text" 
                       class="w-full py-2 px-5 bg-[#fff6eb] border-2 border-gray-300 rounded-full text-sm outline-none focus:border-purple-500 transition-all" 
                       placeholder="cari catatan">
            </div>
        </div>

        <div class="flex items-center">
            <a href="#" class="p-2 hover:bg-white/20 rounded-full transition-all">
                <i data-feather="user"></i>
            </a>
        </div>
    </nav>

    <div class="flex">
        <aside id="nav-links" 
               class="fixed top-[70px] left-0 z-[888] w-[200px] h-[calc(100vh-70px)] bg-[#191944] p-4 flex flex-col justify-between transition-transform duration-300 transform md:translate-x-0 -translate-x-full">
            
            <ul class="space-y-4">
                <li>
                    <a href="main-page.html" class="flex w-full py-2 px-4 bg-antiquewhite text-center font-bold rounded-lg text-gray-800 bg-orange-100 ">
                        <i data-feather="home" class="mr-2"></i>home
                    </a>
                </li>
                <li>
                    <a href="upload.html" class="flex w-full py-2 px-4 bg-antiquewhite text-center font-bold rounded-lg text-purple-900 bg-[#ddaffc]">
                        <i data-feather="edit" class="mr-2"></i>upload
                    </a>
                </li>
                <li>
                    <a href="#" class="flex w-full py-2 px-4 bg-antiquewhite text-center font-bold rounded-lg text-gray-800 bg-orange-100 ">
                        <i data-feather="list" class="mr-2"></i>todo list
                    </a>
                </li>
                <li>
                    <a href="#" class="flex w-full py-2 px-4 bg-antiquewhite text-center font-bold rounded-lg text-gray-800 bg-orange-100 ">
                        <i data-feather="book" class="mr-2"></i> saved
                    </a>    
                </li>
            </ul>

            <div class="mb-4">
                <a href="#" class="block w-full py-2 px-4 bg-[#ddaffc] text-center font-bold rounded-lg text-gray-800 hover:opacity-90 transition-opacity">
                    logout
                </a>
            </div>
        </aside>

        <!-- konten -->
        <main class="flex-1 mt-[70px] md:ml-[200px] p-6 md:p-12 flex justify-center">
    <div class="bg-white w-full max-w-2xl p-8 rounded-2xl shadow-xl border border-purple-100">
        <div class="mb-8">
            <h2 class="text-2xl font-bold text-gray-800">Upload Catatan Baru</h2>
            <p class="text-gray-500">Bagikan catatan kuliahmu dengan mahasiswa lainnya.</p>
        </div>

        <form action="#" method="POST" enctype="multipart/form-data" class="space-y-6">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Judul Catatan</label>
                <input type="text" placeholder="Contoh: Algoritma Minggu 1 - Sorting" 
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-[#ddaffc] focus:outline-none transition-all bg-[#fff6eb]/30">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Mata Kuliah</label>
                    <select class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-[#ddaffc] focus:outline-none transition-all bg-[#fff6eb]/30">
                        <option>Pilih Matkul</option>
                        <option>Algoritma Pemrograman</option>
                        <option>Kalkulus</option>
                        <option>Big Data</option>
                        <option>Kimia</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Tag</label>
                    <input type="text" placeholder="data, coding, rumus" 
                        class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-[#ddaffc] focus:outline-none transition-all bg-[#fff6eb]/30">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">File Catatan (PDF/Gambar)</label>
                <div id="drop-area" class="border-3 border-dashed border-purple-200 rounded-2xl p-10 flex flex-col items-center justify-center bg-purple-50/30 hover:bg-purple-50 transition-colors cursor-pointer group">
                    <div class="p-4 bg-white rounded-full shadow-sm mb-4 group-hover:scale-110 transition-transform">
                        <i data-feather="upload-cloud" class="text-purple-500 w-8 h-8"></i>
                    </div>
                    <p class="text-sm text-gray-600"><span class="font-bold text-purple-600">Klik untuk upload</span> atau drag and drop</p>
                    <p class="text-xs text-gray-400 mt-1">Maksimal ukuran file 10MB</p>
                    <input type="file" class="hidden" id="file-input">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Deskripsi Singkat</label>
                <textarea rows="3" placeholder="Apa yang dipelajari di catatan ini?" 
                    class="w-full px-4 py-3 rounded-xl border-2 border-gray-100 focus:border-[#ddaffc] focus:outline-none transition-all bg-[#fff6eb]/30 resize-none"></textarea>
            </div>

            <div class="flex gap-4 pt-4">
                <button type="button" class="flex-1 py-3 px-6 border-2 border-gray-100 text-gray-500 font-bold rounded-xl hover:bg-gray-50 transition-all">
                    Batal
                </button>
                <button type="submit" class="flex-1 py-3 px-6 bg-[#ddaffc] text-purple-900 font-bold rounded-xl hover:shadow-lg hover:opacity-90 transition-all">
                    Upload Sekarang
                </button>
            </div>
        </form>
    </div>
</main>
    </div>

    <script>
        feather.replace();   
    </script>
    <script src="script.js"></script>
</body>
</html>
