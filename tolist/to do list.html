<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToList</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    display: flex;
    background: #f3f4f6;
}

/* SIDEBAR */
.sidebar {
    width: 220px;
    height: 100vh;
    background: #1e1b4b;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.logo {
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.menu button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
}

.active {
    background: #c4b5fd;
}

.menu button:not(.active) {
    background: white;
}

.logout {
    background: #c4b5fd;
}

/* MAIN */
.main {
    flex: 1;
}

/* TOPBAR */
.topbar {
    background: #c4b5fd;
    padding: 15px;
    display: flex;
    justify-content: center;
}

.search {
    width: 300px;
    padding: 8px 12px;
    border-radius: 20px;
    border: none;
    outline: none;
}

/* CONTENT */
.content {
    padding: 20px;
}

/* BOARD */
.board {
    display: flex;
    gap: 20px;
    justify-content: center;
}

/* COLUMN */
.column {
    background: #ede9fe;
    padding: 15px;
    border-radius: 20px;
    width: 260px;
    min-height: 400px;
}

.column h2 {
    text-align: center;
    margin-bottom: 10px;
}

/* TASK */
.task {
    background: #c4b5fd;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
}

.task textarea {
    width: 100%;
    border: none;
    background: transparent;
    resize: none;
    outline: none;
}

/* BUTTON */
.btn {
    margin-top: 5px;
    padding: 5px 8px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
}

.next { background: #7c3aed; color: white; }
.delete { background: red; color: white; }

/* INPUT */
.add-area {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
}

.add-area input {
    flex: 1;
    padding: 6px;
    border-radius: 8px;
    border: none;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div>
        <div class="logo">ToList</div>

        <div class="menu">
            <button class="active">🏠 home</button>
            <button>✏️ upload</button>
            <button>📋 to-do list</button>
            <button>💾 saved</button>
        </div>
    </div>

    <button class="logout">🚪 logout</button>
</div>

<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <input class="search" placeholder="cari catatan...">
    </div>

    <!-- CONTENT (INI TO DO LIST KAMU) -->
    <div class="content">

        <div class="board">

            <!-- TO DO -->
            <div class="column">
                <h2>To Do</h2>

                <div class="add-area">
                    <input type="text" id="todoInput" placeholder="Tambah task...">
                    <button onclick="addTask()">+</button>
                </div>

                <div id="todo"></div>
            </div>

            <!-- IN PROGRESS -->
            <div class="column">
                <h2>In Progress</h2>
                <div id="progress"></div>
            </div>

            <!-- DONE -->
            <div class="column">
                <h2>Done</h2>
                <div id="done"></div>
            </div>

        </div>

    </div>
</div>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function save() {
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function render() {
    document.getElementById("todo").innerHTML = "";
    document.getElementById("progress").innerHTML = "";
    document.getElementById("done").innerHTML = "";

    tasks.forEach((task, index) => {
        const div = document.createElement("div");
        div.className = "task";

        div.innerHTML = `
            <textarea oninput="edit(${index}, this.value)">${task.text}</textarea>
            <br>
            ${task.status !== "done" ? `<button class="btn next" onclick="move(${index})">Next ➡</button>` : ""}
            <button class="btn delete" onclick="removeTask(${index})">X</button>
        `;

        document.getElementById(task.status).appendChild(div);
    });
}

function addTask() {
    const input = document.getElementById("todoInput");

    if (input.value === "") return;

    tasks.push({
        text: input.value,
        status: "todo"
    });

    input.value = "";
    save();
    render();
}

function move(index) {
    if (tasks[index].status === "todo") tasks[index].status = "progress";
    else if (tasks[index].status === "progress") tasks[index].status = "done";

    save();
    render();
}

function edit(index, value) {
    tasks[index].text = value;
    save();
}

function removeTask(index) {
    tasks.splice(index, 1);
    save();
    render();
}

render();
</script>

</body>
</html>
