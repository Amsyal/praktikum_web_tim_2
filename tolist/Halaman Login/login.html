<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fa fa-user login-icon"></i>
                <h2>Form Login</h2>
            </div>
            
            <form id="loginForm">
                <table style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <td>
                            <div class="form-group">
                                <i class="fa fa-user"></i>
                                <input type="text" id="username" name="Username" placeholder="Username" required>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="form-group">
                                <i class="fa fa-lock"></i>
                                <input type="password" id="password" name="Password" placeholder="Password" required>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="form-group">
                                <i class="fa fa-lock"></i>
                                <input type="password" id="verify_password" name="Verify_Password" placeholder="Verify Password" required>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="forget">
                                <a href="#">Forget Password?</a>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <button type="submit" class="login-button">Login</button>
                        </td>
                    </tr>
                </table>
            </form>

            <div id="result" class="result-container"></div>
            
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;
            let verifyPass = document.getElementById('verify_password').value;
            
            if (pass !== verifyPass) {
                alert("Login gagal, silahkan cek username dan password");
                return; 
            }

            let resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block'; 
            resultDiv.innerHTML = `
                <div style="text-align: center; color: var(--primary-dark); margin-bottom: 5px;">
                    <i class="fa fa-check-circle" style="color: var(--success); font-size: 20px;"></i><br>
                    <strong>Login Berhasil!</strong>
                </div>
                Username: ${user}<br>
                Password: ${pass}
            `;
        });
    </script>
</body>
</html>
